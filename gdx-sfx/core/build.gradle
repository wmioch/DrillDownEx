
apply plugin: 'java-library'

sourceCompatibility = 1.8
targetCompatibility = 1.8

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation "games.spooky.gdx:gdx-nativefilechooser:1.0.0"
}

apply plugin: 'maven-publish'

archivesBaseName = "$libName"

configurations {
    demo.extendsFrom testRuntime
}

task demoJar(type: Jar) {
    archiveClassifier.set('demo')
    from sourceSets.test.output
}

artifacts {
    demo demoJar
}

// Javadoc
task javadocJar (type: Jar, dependsOn: javadoc) {
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

// Sources
task sourcesJar (type : Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

artifacts {
    archives sourcesJar
    archives javadocJar
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId "$libName"
            from components.java

            artifact sourcesJar
            artifact javadocJar
        }
    }
}

apply from: '../license.gradle'
license.includes(["**/*.java"])

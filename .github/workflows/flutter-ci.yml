name: Flutter CI

on:
  push:
    paths:
      - 'flutter_game/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'flutter_game/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

jobs:
  flutter-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_game
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Fetch packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --exclude-tags integration

      - name: Run integration tests
        run: flutter test --tags integration

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Linux desktop bundle
        run: flutter build linux --release

      - name: Package Linux desktop bundle
        run: tar -czf flutter-linux-bundle.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Linux desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-desktop
          path: flutter-linux-bundle.tar.gz
          if-no-files-found: error

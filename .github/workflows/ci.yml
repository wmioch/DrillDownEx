name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          
          # Verify Android SDK setup
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not set}"
          ls -la ${ANDROID_HOME}/cmdline-tools/ || true
          
          # Accept licenses first
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install required SDK components including NDK and CMake
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-30" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1"

      - name: Verify Android SDK installation
        run: |
          echo "Installed Android platforms:"
          ls -la ${ANDROID_HOME}/platforms/ || echo "No platforms directory"
          echo "Installed build-tools:"
          ls -la ${ANDROID_HOME}/build-tools/ || echo "No build-tools directory"

      - name: Build desktop distribution
        run: ./gradlew desktop:dist --no-daemon --stacktrace

      - name: Assemble Android debug build
        run: ./gradlew android:assembleFullDebug --no-daemon --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

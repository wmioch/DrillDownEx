name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Set up signing keystore
        run: |
          # Decode base64 keystore and save to file in android directory
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/drilldown.keystore
          # Verify keystore was created
          ls -lh android/drilldown.keystore
          echo "Keystore saved at: $(pwd)/android/drilldown.keystore"

      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          
          # Verify Android SDK setup
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not set}"
          ls -la ${ANDROID_HOME}/cmdline-tools/ || true
          
          # Accept licenses first
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install required SDK components including NDK and CMake
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-30" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1"

      - name: Verify Android SDK installation
        run: |
          echo "Installed Android platforms:"
          ls -la ${ANDROID_HOME}/platforms/ || echo "No platforms directory"
          echo "Installed build-tools:"
          ls -la ${ANDROID_HOME}/build-tools/ || echo "No build-tools directory"

      - name: Build desktop distribution
        run: ./gradlew desktop:dist --no-daemon --stacktrace

      - name: Install Mesa and Xvfb for headless OpenGL testing
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils xvfb libxvmc1

      - name: Start Xvfb virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2

      - name: Run desktop smoke test with Mesa llvm-pipe
        env:
          DISPLAY: :99
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: 4
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh

      - name: Assemble Android release build (signed)
        run: |
          ./gradlew android:assembleFullRelease \
            -Pkeypass_file=drilldown.keystore \
            -Pkeypass_alias=${{ secrets.KEY_ALIAS }} \
            -Pkeypass_pwd=${{ secrets.KEY_PASSWORD }} \
            --no-daemon --stacktrace

      - name: Upload Android release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

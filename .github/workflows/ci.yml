name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v2

    - name: Set up OpenGL
      uses: setup-opengl@v1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl-dev libglu1-mesa-dev

    - name: Compile
      run: |
        make

    - name: Smoke test
      run: |
        make test

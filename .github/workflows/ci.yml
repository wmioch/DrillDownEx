name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Set up signing keystore
        run: |
          # Decode base64 keystore and save to file in android directory
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/drilldown.keystore
          # Verify keystore was created
          ls -lh android/drilldown.keystore
          echo "Keystore saved at: $(pwd)/android/drilldown.keystore"

      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          
          # Verify Android SDK setup
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not set}"
          ls -la ${ANDROID_HOME}/cmdline-tools/ || true
          
          # Accept licenses first
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install required SDK components including NDK and CMake
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-30" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1"

      - name: Verify Android SDK installation
        run: |
          echo "Installed Android platforms:"
          ls -la ${ANDROID_HOME}/platforms/ || echo "No platforms directory"
          echo "Installed build-tools:"
          ls -la ${ANDROID_HOME}/build-tools/ || echo "No build-tools directory"

      - name: Rebuild texture atlas
        run: ./gradlew desktop:run --args="textures" --no-daemon --stacktrace

      - name: Stage regenerated texture atlases
        run: |
          set -euo pipefail
          shopt -s nullglob

          atlas_dir=android/assets
          files=(${atlas_dir}/tex*.png ${atlas_dir}/tex*.atlas)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No regenerated texture atlases found in ${atlas_dir}"
            exit 1
          fi

          mkdir -p desktop/build/packaged-assets
          for file in "${files[@]}"; do
            cp "$file" desktop/build/packaged-assets/
          done

          ls -la desktop/build/packaged-assets

      - name: Build desktop distribution
        run: ./gradlew desktop:dist --no-daemon --stacktrace

      - name: Assemble Android release build (signed)
        run: |
          ./gradlew android:assembleFullRelease \
            -Pkeypass_file=drilldown.keystore \
            -Pkeypass_alias=${{ secrets.KEY_ALIAS }} \
            -Pkeypass_pwd=${{ secrets.KEY_PASSWORD }} \
            --no-daemon --stacktrace

      - name: Verify regenerated textures packaged in APK
        run: |
          set -euo pipefail
          shopt -s nullglob

          atlas_dir=android/assets
          files=(${atlas_dir}/tex*.png ${atlas_dir}/tex*.atlas)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No regenerated texture atlases present in ${atlas_dir}"
            exit 1
          fi

          apk_path=$(ls android/build/outputs/apk/full/release/*.apk)
          echo "Inspecting APK: ${apk_path}"

          for file in "${files[@]}"; do
            name=$(basename "$file")
            if ! unzip -l "$apk_path" "assets/${name}" >/dev/null; then
              echo "Missing ${name} in packaged APK"
              exit 1
            fi

            source_hash=$(sha256sum "$file" | cut -d' ' -f1)
            apk_hash=$(unzip -p "$apk_path" "assets/${name}" | sha256sum | cut -d' ' -f1)

            if [ "$source_hash" != "$apk_hash" ]; then
              echo "Checksum mismatch for ${name}: source ${source_hash} vs APK ${apk_hash}"
              exit 1
            fi
          done

          echo "Texture atlas assets match between source and APK"

      - name: Upload Android release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Regenerate texture atlas
        run: .\\gradlew.bat desktop:run --args="textures" --no-daemon --stacktrace

      - name: Stage regenerated texture atlases
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          atlas_dir=android/assets
          files=(${atlas_dir}/tex*.png ${atlas_dir}/tex*.atlas)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No regenerated texture atlases found in ${atlas_dir}"
            exit 1
          fi

          mkdir -p desktop/build/packaged-assets
          for file in "${files[@]}"; do
            cp "$file" desktop/build/packaged-assets/
          done

          ls -la desktop/build/packaged-assets

      - name: Build desktop distribution
        run: .\\gradlew.bat desktop:dist --no-daemon --stacktrace

      - name: Package desktop debug build
        shell: bash
        run: |
          set -euo pipefail

          debug_dir=desktop/build/debug-dist
          mkdir -p "$debug_dir"

          cp desktop/build/libs/desktop-1.0.jar "$debug_dir/"

          cat >"$debug_dir/run-debug.bat" <<'EOF'
          @echo off
          set SCRIPT_DIR=%~dp0
          java -jar "%SCRIPT_DIR%\\desktop-1.0.jar" debug
          EOF

          if [ -d desktop/build/packaged-assets ]; then
            cp desktop/build/packaged-assets/* "$debug_dir/"
          fi

      - name: Upload Windows desktop debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-debug-dist
          path: desktop/build/debug-dist/**
          if-no-files-found: error

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-dist
          path: |
            desktop/build/libs/*.jar
            desktop/build/distributions/*.zip
            desktop/build/packaged-assets/*
          if-no-files-found: error
